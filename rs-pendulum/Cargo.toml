[package]
name = "pendulumd"
version = "0.1.0"
edition = "2024"

[features]
default = ["sim", "gui"]
sim = []
hw = ["dep:mpu6050", "dep:linux-embedded-hal"]
gui = ["dep:bevy"]

[dependencies]
bevy = { version = "0.15", default-features = true, optional = true }
mpu6050 = { version = "0.1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
linux-embedded-hal = { version = "0.3", optional = true }
