[package]
name = "pendulum-lib"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "pencat",
    "pengui",
    "penfw",
    "pensim",
]
default-members = [
    ".",
    "pencat",
    "pengui",
    "pensim",
]
resolver = "2"

[lib]
name = "pendulum_lib"
path = "src/lib.rs"

[dependencies]
bevy_ecs = "0.15"
postcard = { version = "1.1", features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
