[package]
name = "penfw"
version = "0.1.0"
edition = "2024"
default-run = "penfw"

[dependencies]
bevy_ecs = { version = "0.18.1", default-features = false }
libm = "0.2"
postcard = "1.1"
serde = { version = "1.0", default-features = false, features = ["derive"] }
uom = { version = "0.38.0", default-features = false, features = [
    "autoconvert",
    "f64",
    "si",
    "serde",
] }

[target.xtensa-esp32-none-elf.dependencies]
esp-alloc = "0.8.0"
esp-hal = { version = "=1.0.0-rc.0", features = ["esp32", "unstable"] }
esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32"] }
embedded-storage = "0.3.1"
esp-storage = { version = "0.7.0", features = ["esp32"] }
esp-wifi = { version = "0.15.1", default-features = false, features = [
    "builtin-scheduler",
    "esp-alloc",
    "esp32",
    "smoltcp",
    "wifi",
] }
pendulum-lib = { path = "..", default-features = false, features = ["ecs"] }
smoltcp = { version = "0.12.0", default-features = false, features = [
    "medium-ethernet",
    "proto-dhcpv4",
    "socket-dhcpv4",
] }
